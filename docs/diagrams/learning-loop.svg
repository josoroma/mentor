<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">From a learning focus to a conversation worth keeping</title>
  <desc id="desc">Choose a professional role or life skill and English level. Wait for the complete scenario batch to load, then AI conversation partners start when browser playback is allowed. Listen, enable the microphone to join, or enter scenario practice. Original and improved wording save together, and completed practice can be reviewed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="m2 1 4 4-4 4" fill="none" stroke="#1447e6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.8px; fill: #1447e6; }
    .heading { font-size: 28px; font-weight: 700; letter-spacing: -.7px; fill: #171717; }
    .label { font-size: 19px; font-weight: 700; letter-spacing: -.35px; fill: #171717; }
    .body { font-size: 14px; fill: #666; }
    .number { font-size: 12px; font-weight: 700; fill: #1447e6; }
    .card { fill: #fff; stroke: #e5e5e5; }
    .connector { fill: none; stroke: #1447e6; stroke-width: 1.8; marker-end: url(#arrow); }
  </style>
  <rect x=".5" y=".5" width="999" height="649" rx="20" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="32" y="35" class="eyebrow">THE PRACTICE LOOP</text>
  <text x="32" y="75" class="heading">Find your voice in the moments that matter.</text>
  <text x="32" y="102" class="body">A familiar context, two AI partners, and a clearer way to say what you mean.</text>

  <rect x="32" y="132" width="296" height="188" rx="14" class="card"/>
  <rect x="52" y="152" width="30" height="26" rx="7" fill="#eef3ff"/>
  <text x="67" y="170" text-anchor="middle" class="number">01</text>
  <text x="52" y="208" class="label">Choose your focus</text>
  <text x="52" y="235" class="body">Professional role or life skill,</text>
  <text x="52" y="256" class="body">tailored to your English level.</text>
  <rect x="52" y="275" width="147" height="25" rx="6" fill="#f5f5f5"/>
  <text x="64" y="292" font-size="11" fill="#525252">YOUR LEARNING PATH</text>

  <path d="M332 226h18" class="connector"/>
  <rect x="356" y="132" width="288" height="188" rx="14" class="card"/>
  <rect x="376" y="152" width="30" height="26" rx="7" fill="#eef3ff"/>
  <text x="391" y="170" text-anchor="middle" class="number">02</text>
  <text x="376" y="208" class="label">Load the scenarios</text>
  <text x="376" y="235" class="body">Fresh, relevant situations</text>
  <text x="376" y="256" class="body">generated by the local coach.</text>
  <g fill="#eef3ff" stroke="#cdd9fc">
    <rect x="376" y="275" width="66" height="25" rx="5"/>
    <rect x="448" y="275" width="66" height="25" rx="5"/>
    <rect x="520" y="275" width="66" height="25" rx="5"/>
  </g>
  <path d="m399 287 5 5 10-10m57 5 5 5 10-10m57 5 5 5 10-10" fill="none" stroke="#1447e6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M648 226h18" class="connector"/>
  <rect x="672" y="132" width="296" height="188" rx="14" fill="#eef3ff" stroke="#cdd9fc"/>
  <rect x="692" y="152" width="30" height="26" rx="7" fill="#fff"/>
  <text x="707" y="170" text-anchor="middle" class="number">03</text>
  <text x="692" y="208" class="label">AI partners begin</text>
  <text x="692" y="235" class="body">Autostart waits for the complete</text>
  <text x="692" y="256" class="body">scenario batch to finish loading.</text>
  <circle cx="702" cy="287" r="5" fill="#1447e6"/>
  <text x="716" y="292" font-size="12" fill="#1447e6">Enable voice if the browser asks</text>

  <path d="M820 325v30" class="connector"/>

  <rect x="672" y="364" width="296" height="196" rx="14" class="card"/>
  <rect x="692" y="384" width="30" height="26" rx="7" fill="#f4efff"/>
  <text x="707" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">04</text>
  <text x="692" y="440" class="label">Listen. Join. Practice.</text>
  <text x="692" y="467" class="body">Enable your mic to join the pair,</text>
  <text x="692" y="488" class="body">or choose a scenario to practice.</text>
  <rect x="692" y="511" width="120" height="28" rx="7" fill="#1447e6"/>
  <text x="752" y="530" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Your mic is off</text>
  <text x="824" y="530" font-size="12" fill="#777">until you join</text>

  <path d="M666 462h-18" class="connector"/>
  <rect x="356" y="364" width="288" height="196" rx="14" class="card"/>
  <rect x="376" y="384" width="30" height="26" rx="7" fill="#f4efff"/>
  <text x="391" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">05</text>
  <text x="376" y="440" class="label">See your words, refined</text>
  <text x="376" y="467" class="body">Original + improved English,</text>
  <text x="376" y="488" class="body">together in the live transcript.</text>
  <rect x="376" y="511" width="248" height="28" rx="7" fill="#f4efff"/>
  <text x="388" y="530" font-size="12" fill="#7c3aed">YOU, REFINED · pause to play aloud</text>

  <path d="M350 462h-18" class="connector"/>
  <rect x="32" y="364" width="296" height="196" rx="14" class="card"/>
  <rect x="52" y="384" width="30" height="26" rx="7" fill="#eef3ff"/>
  <text x="67" y="402" text-anchor="middle" class="number">06</text>
  <text x="52" y="440" class="label">Keep the learning</text>
  <text x="52" y="467" class="body">Contributions save automatically.</text>
  <text x="52" y="488" class="body">Review your completed practice.</text>
  <path d="m53 525 5 5 10-10" fill="none" stroke="#1447e6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="78" y="530" font-size="12" fill="#525252">On this device + local database</text>

  <line x1="32" y1="587" x2="968" y2="587" stroke="#e5e5e5"/>
  <circle cx="38" cy="614" r="4" fill="#7c3aed"/>
  <text x="52" y="619" font-size="13" fill="#666">Your actual words create your learning record. Listening alone does not create history or scores.</text>
</svg>
